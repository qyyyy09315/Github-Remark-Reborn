<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>GithubRemarkReborn 商店版图标（吊牌 + 铅笔）</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底板 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 白色吊牌（标签）剪影 -->
  <path d="M150 160 H320 L420 256 L320 352 H150
           A28 28 0 0 1 122 324 V188
           A28 28 0 0 1 150 160 Z"
        fill="#ffffff"/>

  <!-- 标签圆孔：用底色渐变挖空 -->
  <circle cx="354" cy="256" r="16" fill="url(#bg)"/>

  <!-- 右下角短铅笔，蓝色细缝与标签分隔（仅大尺寸使用） -->
  <g transform="rotate(-45 382 388)" stroke="url(#bg)" stroke-width="14" stroke-linejoin="round">
    <rect x="300" y="372" width="120" height="32" rx="8" fill="#ffffff"/>
    <path d="M420 372 L456 388 L420 404 Z" fill="#ffffff"/>
  </g>
</svg>
